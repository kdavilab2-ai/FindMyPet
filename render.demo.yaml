# Blueprint independiente para una demostración académica en Render.
previews:
  generation: off

services:
  - type: web
    name: findmypet-unemi-demo-api
    runtime: node
    branch: main
    rootDir: server
    region: oregon
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:prod
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "24.x"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: findmypet-unemi-demo-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: findmypet-unemi-demo
    runtime: static
    branch: main
    rootDir: client
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24.x"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_URL
        sync: false

databases:
  - name: findmypet-unemi-demo-db
    region: oregon
    plan: free
    ipAllowList: []
